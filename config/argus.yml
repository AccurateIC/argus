# Argus configuration. Everything the reviewer's behavior depends on lives here so
# it's reviewable in a PR like any other change.

version: 1

# Backend: ollama (local/LAN, free) or claude (Anthropic API / Claude Code Action).
# Switch to claude when you have an ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN.
backend: ollama

# Which review skills run, in priority order. Comment out any you don't want.
skills:
  - security
  - data-protection
  - correctness
  - concurrency
  - performance
  - api-compat
  - tests
  - observability
  - dependencies
  # - your-custom-skill        # add skills/your-custom-skill.md and list it here

# Severity gate: the lowest severity that causes a "request changes" verdict.
# One of: blocker | major | minor. Default: major.
gate: major

verdict:
  # OFF by default. When false, Argus only comments or requests changes — it never
  # approves. Turning this on lets argus[bot] submit an APPROVE review; whether that
  # approval counts toward branch protection is a separate repo-owner decision.
  # READ docs/governance.md before enabling.
  allow_approve: false
  # Never approve PRs opened by these actors (bots/automation).
  never_approve_authors:
    - "dependabot[bot]"
    - "renovate[bot]"
    - "argus[bot]"

# Path rules. Globs are matched against changed file paths.
paths:
  # Skip entirely (generated, vendored, lockfiles). No findings raised here.
  skip:
    - "**/*.lock"
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/*.min.js"
    - "**/__generated__/**"
    - "**/migrations/**/*.py"     # reviewed by api-compat, but not style-nitted
  # Raise the bar: in these dirs, drop every finding one severity higher and be
  # extra thorough on security/data-protection.
  strict:
    - "**/auth/**"
    - "**/billing/**"
    - "**/payments/**"
    - "**/*permission*"
    - "**/*tenant*"

# Keep reviews readable. Max inline comments before Argus rolls the rest into the
# summary table (prevents 40-comment noise-bombs).
limits:
  max_inline_comments: 15
  # 0 = review every changed file in one Actions run via automatic multi-pass
  # Ollama batches sized to fit num_ctx. Set >0 to hard-cap file count.
  # Optional override: `@neubodhi first 40 files`.
  # Coverage is proof-checked: incomplete passes fail the Actions check.
  max_files: 0
  # Soft cap on changed lines *per automatic pass* when packing files. Oversized
  # single files are hunk-split across further passes when possible.
  max_diff_lines: 8000

# Claude model (used when backend: claude). Omit to inherit the action's default.
model: "claude-sonnet-4-6"

# Ollama settings (used when backend: ollama). Requires a self-hosted runner that
# can reach host (GitHub-hosted ubuntu-latest cannot see a LAN IP).
ollama:
  host: "http://192.168.10.46:11434"
  model: "qwen3.6:27b"

# Deterministic static analysis — language-specific analyzers.
# Enabling does not change the Ollama model or num_ctx. Findings only on
# PR-changed lines. Analyzers run only for matching file types in the PR.
advanced_findings:
  enabled: true
  python:
    ruff: true
    ast: true
# Add ANTHROPIC_API_KEY (or OAuth token). No skill rewrites.

