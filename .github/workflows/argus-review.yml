name: Neubodhi  Review

# Reusable + standalone PR-review workflow.
#
# Backends (config/argus.yml → backend):
#   • ollama — scripts/argus_ollama.py against a LAN/local Ollama (needs self-hosted runner)
#   • claude — anthropics/claude-code-action (needs ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN)
#
# Verdict policy (see docs/governance.md):
#   • request-changes  — when a finding at/above `gate` is confirmed
#   • comment          — the default: findings surfaced, human sign-off still required
#   • approve          — OFF by default (verdict.allow_approve: true)

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to argus.yml
        type: string
        default: config/argus.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: argus-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Read backend from config so Ollama jobs land on self-hosted (LAN) and Claude
  # can use GitHub-hosted runners.
  resolve:
    if: >
      (github.event_name == 'workflow_call') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@neubodhi'))
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.cfg.outputs.backend }}
      config_path: ${{ steps.cfg.outputs.config_path }}
    steps:
      # Harness + config live in AccurateIC/argus, not in the app repo.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/argus
      - id: cfg
        run: |
          CONFIG_PATH="${{ github.event_name == 'workflow_call' && inputs.config-path || 'config/argus.yml' }}"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "Missing $CONFIG_PATH" >&2
            exit 1
          fi
          BACKEND=$(awk '/^backend:/{print $2; exit}' "$CONFIG_PATH" | tr -d '"' | tr -d "'")
          BACKEND="${BACKEND:-claude}"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "config_path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"
          echo "Argus backend=$BACKEND config=$CONFIG_PATH"

  review:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.backend == 'ollama' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout Argus harness
        if: needs.resolve.outputs.backend == 'ollama'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/argus
          fetch-depth: 0

      - name: Checkout PR repo
        if: needs.resolve.outputs.backend == 'claude'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Argus (Ollama)
        if: needs.resolve.outputs.backend == 'ollama'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_COMMENT: ${{ github.event.comment.body }}
          ARGUS_CONFIG: ${{ needs.resolve.outputs.config_path }}
          GH_TOKEN: ${{ github.token }}
          # Review the calling repo's PR, not AccurateIC/argus.
          GH_REPO: ${{ github.repository }}
          # 27B reviews of big prompts can take >10m; stream + long overall budget.
          OLLAMA_TIMEOUT: "1800"
          OLLAMA_CHUNK_TIMEOUT: "600"
          # qwen3.6:27b supports 262144; 32768 truncated real PRs mid-diff.
          OLLAMA_NUM_CTX: "65536"
        run: python3 scripts/argus_ollama.py

      - name: Run Argus (Claude)
        if: needs.resolve.outputs.backend == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          # Either secret works; CLAUDE_CODE_OAUTH_TOKEN takes precedence if set.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are **Argus**, this repository's automated PR reviewer.
            Review pull request #${{ github.event.pull_request.number || github.event.issue.number }}.

            Follow the harness instructions exactly:

            1. Read `prompts/system.md` — it defines your persona, rules, and
               the hard line that you never approve to merely clear a gate.
            2. Read `${{ needs.resolve.outputs.config_path }}` to learn which skills are enabled, the
               severity gate, and path rules (skip/strict globs).
            3. Load every enabled skill from `skills/<name>.md`. Each is a rubric.
            4. Load repo memory: `memory/conventions.md`,
               `memory/accepted-patterns.md`, and any relevant `memory/knowledge/*`.
               Treat accepted-patterns as authoritative — do NOT re-flag them.
            5. Get the diff: `gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}`.
               Read the surrounding code (not just diff hunks) for anything you're
               unsure about — false positives from missing context are the #1 way
               reviewers lose trust.
            6. For each enabled skill, apply its rubric and collect findings.
               Dedupe across skills. Assign each finding a severity
               (blocker | major | minor | nit) and a `file:line` citation.
            7. Follow `prompts/verdict.md` to decide + submit the review:
               - Post concise inline comments for real issues only.
               - Post a summary keyed by skill, with a findings table.
               - If any confirmed blocker/major → `gh pr review <n> --request-changes`.
               - Else → `gh pr review <n> --comment`.
               - Only `--approve` if `verdict.allow_approve: true` in config AND you
                 have zero blocker/major findings AND you would genuinely sign off.
            8. If you notice a pattern the repo keeps accepting, or a convention
               worth recording, add a short "📝 Memory suggestion" section — a human
               will decide whether to merge it into `memory/`.

            Be concrete, cite file:line, and prefer precision over volume.
          claude_args: >-
            --model claude-sonnet-4-6 --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr comment:*),Read,Grep,Glob"
