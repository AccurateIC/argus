name: Neubodhi  Review

# Reusable + standalone PR-review workflow.
#
# Backends (config/argus.yml → backend):
#   • ollama — scripts/argus_ollama.py against a LAN/local Ollama (needs self-hosted runner)
#   • claude — currently unavailable here (org Actions allowlist blocks external actions)
#
# Checkout uses `git` + GITHUB_TOKEN instead of actions/checkout so this workflow
# can run under orgs that only allow AccurateIC-owned actions.
#
# Verdict policy (see docs/governance.md):
#   • request-changes  — when a finding at/above `gate` is confirmed
#   • comment          — the default: findings surfaced, human sign-off still required
#   • approve          — OFF by default (verdict.allow_approve: true)

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to argus.yml
        type: string
        default: config/argus.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: argus-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Read backend from config so Ollama jobs land on self-hosted (LAN).
  resolve:
    if: >
      (github.event_name == 'workflow_call') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@neubodhi'))
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.cfg.outputs.backend }}
      config_path: ${{ steps.cfg.outputs.config_path }}
    steps:
      # Harness + config live in AccurateIC/argus, not in the app repo.
      - name: Checkout Argus harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          DEST="${GITHUB_WORKSPACE}"
          find "$DEST" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/argus.git" \
            "$DEST"
      - id: cfg
        run: |
          CONFIG_PATH="${{ github.event_name == 'workflow_call' && inputs.config-path || 'config/argus.yml' }}"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "Missing $CONFIG_PATH" >&2
            exit 1
          fi
          BACKEND=$(awk '/^backend:/{print $2; exit}' "$CONFIG_PATH" | tr -d '"' | tr -d "'")
          BACKEND="${BACKEND:-claude}"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "config_path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"
          echo "Argus backend=$BACKEND config=$CONFIG_PATH"

  review:
    needs: resolve
    # Runner journalctl only prints this name ("Running job: …"), not step stdout.
    # Must be quoted: an unquoted `#` is a YAML comment and drops PR + actor.
    name: "${{ github.repository }} #${{ github.event.pull_request.number || github.event.issue.number }} @${{ github.actor }}"
    runs-on: ${{ needs.resolve.outputs.backend == 'ollama' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout Argus harness
        if: needs.resolve.outputs.backend == 'ollama'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          DEST="${GITHUB_WORKSPACE}"
          find "$DEST" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          # Full history not required for the Ollama harness (uses gh pr diff).
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/argus.git" \
            "$DEST"

      - name: Run Argus (Ollama)
        if: needs.resolve.outputs.backend == 'ollama'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_COMMENT: ${{ github.event.comment.body }}
          ARGUS_CONFIG: ${{ needs.resolve.outputs.config_path }}
          GH_TOKEN: ${{ github.token }}
          # Review the calling repo's PR, not AccurateIC/argus.
          GH_REPO: ${{ github.repository }}
          # 27B reviews of big prompts can take >10m; stream + long overall budget.
          OLLAMA_TIMEOUT: "1800"
          OLLAMA_CHUNK_TIMEOUT: "600"
          # Context window for Ollama (tokens). Override via env if needed.
          OLLAMA_NUM_CTX: "65536"
          OLLAMA_NUM_PREDICT: "8192"
        # Mirror step stdout/stderr into journald so `journalctl -t argus` works on
        # the self-hosted runner (runner service logs alone only show job name).
        shell: bash
        run: |
          set -o pipefail
          # Stamp journal lines in IST inside the message (host timezone stays UTC).
          python3 scripts/argus_ollama.py 2>&1 | while IFS= read -r line || [ -n "$line" ]; do
            printf '%s\n' "$line"
            logger -t argus -- "$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST') ${line}" || true
          done
          exit "${PIPESTATUS[0]}"

      # Claude uses an external action; AccurateIC allowlist blocks it at workflow
      # parse time even when this step is skipped. Keep a clear failure instead.
      - name: Run Argus (Claude)
        if: needs.resolve.outputs.backend == 'claude'
        run: |
          echo "Claude backend is not available: this org only allows AccurateIC-owned Actions," >&2
          echo "so anthropics/claude-code-action cannot be used." >&2
          echo "Set backend: ollama in AccurateIC/argus config/argus.yml (current production path)." >&2
          exit 1
